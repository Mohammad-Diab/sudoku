<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Syrian Software Center</title>
</head>

<body>
    <div>

        <nav class="app-bar">
            <button onclick="showHamburgerMenu();" class="button bar-button hamburger-button">
                <span class="material-icons">menu</span>
            </button>
            <div class="bar-font title">Syrian Software Center</div>
            <button class="button bar-button more-button">
                <span class="material-icons">more_vert</span>
            </button>
            <button class="button bar-button more-button">
                <span id="pauseIcon" class="material-icons">share</span>
                <span id="pauseText">Share</span>
            </button>
            <button onclick="checkButtonClick()" class="button bar-button more-button">
                <span class="material-icons">favorite_border</span>
                <span>Add to favorite</span>
            </button>
            <!-- <div class="bar-font timer">00:00</div> -->
        </nav>
        <div id="hamburger-menu" class="hamburger-menu">
            <nav id="nav-menu" class="nav-menu">
                <div class="nav-head">
                    <div class="nav-head-img">
                        <img src="img/logo.png" art="" />
                    </div>
                    <div class="nav-head-title">Syrian Software Center</div>
                </div>
                <ul class="nav-items">
                    <button onclick="showDialog('dialog');" ripple-color="#003c8f" class="button nav-item vertical-adjust" href="#">
                        <div>
                            <span class="material-icons">add</span>
                            <span style="left:12px;">New game</span>
                        </div>
                    </button>
                    <button ripple-color="#003c8f" class="button nav-item vertical-adjust" href="#">
                        <div>
                            <span class="material-icons">edit</span>
                            <span style="left:12px;">Sudoku Solver</span>
                        </div>
                    </button>
                    <button onclick="showDialog('about-dialog');" ripple-color="#003c8f" class="button nav-item vertical-adjust" href="#">
                        <div>
                            <span class="material-icons">star</span>
                            <span style="left:12px;">About</span>
                        </div>
                    </button>
                    <div class="bar-footer">
                        <ul>
                            <a href="#" class="bar-footer-link">Site feedback</a>
                            <a href="#" class="bar-footer-link">Privacy</a>
                            <a href="#" class="bar-footer-link">Terms</a>
                        </ul>
                    </div>
                </ul>
            </nav>
            <div class="nav-menu-blank" onclick="hideHamburgerMenu()">

            </div>
        </div>

        <div class="floating">
            <button onclick="showDialog('dialog');" class="button floating-btn vertical-adjust">
                <span class="material-icons">list</span>
            </button>
        </div>

        <div id="dialog" class="dialog">
            <div id="dialog-box" class="dialog-content">
                <div class="dialog-header">New game</div>

                <div class="dialog-body">
                    <p>Select game difficulty to get started.</p>
                    <ul>
                        <li class="radio-option">
                            <label for="very-easy">
                                <input id="very-easy" value="very easy" type="radio" name="difficulty"> Very easy
                            </label>
                        </li>
                        <li class="radio-option">
                            <label for="easy">
                                <input id="easy" value="easy" type="radio" name="difficulty"> Easy
                            </label>
                        </li>
                        <li class="radio-option">
                            <label for="normal">
                                <input id="normal" value="normal" type="radio" name="difficulty"> Normal
                            </label>
                        </li>
                        <li class="radio-option">
                            <label for="hard">
                                <input id="hard" value="hard" type="radio" name="difficulty"> Hard
                            </label>
                        </li>
                        <li class="radio-option">
                            <label for="very-hard">
                                <input id="very-hard" value="expert" type="radio" name="difficulty"> Expert
                            </label>
                        </li>
                    </ul>
                </div>

                <div class="dialog-footer">
                    <button onclick="startGame();" ripple-color="#003c8f" class="button dialog-btn vertical-adjust" href="#">OK</button>
                    <button onclick="hideDialog('dialog');" ripple-color="#202020" class="button dialog-btn vertical-adjust" href="#">Cancel</button>
                </div>
            </div>
        </div>

        <div id="about-dialog" class="dialog">

            <div id="about-dialog-box" onblur="hideDialog('about-dialog');" class="dialog-content about-dialog-content">
                <div class="dialog-header">CodeTeam6</div>

                <div class="dialog-body">
                    <p>about us</p>
                    <div class="card-group">
                        <div class="card dialog-card">
                            <div class="about-card-img">
                                <img src="img/m_diab.jpg" alt="" />
                            </div>
                            <div class="about-card-title">Mohamamd Diab</div>
                            <div class="about-card-content">Syria</div>
                            <div class="about-card-quote">I love problems, algorithms are my life.</div>
                        </div>


                    </div>
                </div>

                <div class="dialog-footer">
                    <button onclick="hideDialog('about-dialog');" ripple-color="#003c8f" class="button dialog-btn vertical-adjust" href="#">OK</button>
                </div>
            </div>
        </div>
        <div class="footer vertical-adjust">
            <span class="material-icons">code</span>
            <span>with</span>
            <span style="color:red" class="material-icons">favorite</span>
            <span>by Mohammad Diab from</span>
            <a onclick="showDialog('about-dialog');" href="#">#codeTeam6</a>
            <span> . © 2018 all right reserved.</span>
        </div>
    </div>





    <script src="js/script.js"></script>
</body>

</html>
